name: farmap

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: zhgy
      MYSQL_USER: zhgy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [farmap]

  mongo:
    image: mongo:4.4.6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [farmap]

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    networks: [farmap]

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
    networks: [farmap]

  milvus:
    image: milvusdb/milvus:v2.5.1
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [farmap]

  tree-analyzer:
    build:
      context: ../zhgy
    restart: unless-stopped
    environment:
      API_KEYS: ${MODEL_API_KEY}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY}
      PORT: "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [farmap]

  backend:
    build:
      context: ../zhgy/zhgy
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhgy?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: zhgy
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: zhgy
      SPRING_DATA_MONGODB_USERNAME: root
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MODEL_API_URL: http://tree-analyzer:5000/analyze
      MODEL_API_KEY: ${MODEL_API_KEY}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY}
      HUNYUAN_TEXT_MODEL: ${HUNYUAN_TEXT_MODEL:-hunyuan-a13b}
      GAODE_API_KEY: ${GAODE_API_KEY}
      HIKYUN_ACCESS_KEY: ${HIKYUN_ACCESS_KEY}
      HIKYUN_SECRET_KEY: ${HIKYUN_SECRET_KEY}
      HIKYUN_PRODUCT_CODE: ${HIKYUN_PRODUCT_CODE}
      HIKYUN_PROJECT_ID: ${HIKYUN_PROJECT_ID}
      ZHGY_JWT_USER_SECRET_KEY: ${JWT_SECRET}
      ZHGY_UPLOAD_DIR: /app/uploads
      ZHGY_UPLOAD_BASE_URL: http://backend:8080/uploads
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1536m -Dfile.encoding=UTF-8
    volumes:
      - uploads-data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      tree-analyzer:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "127.0.0.1:24009:8080"
    networks: [farmap]

  frontend:
    build:
      context: ../farmap-frontend-dev
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:24080:80"
    networks: [farmap]

networks:
  farmap:

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
  uploads-data:
