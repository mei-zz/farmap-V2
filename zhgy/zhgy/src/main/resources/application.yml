spring:
  config:
    import:
      - classpath:farmap-models.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/zhgy?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:zhgy}
    password: ${SPRING_DATASOURCE_PASSWORD:}
#    url: jdbc:mysql://localhost:3306/zhgy?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
#    username: root   #root
#    password: ${SPRING_DATASOURCE_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    mongodb:
      # 条件化启用MongoDB自动配置
      auto-index-creation: false
      host: ${SPRING_DATA_MONGODB_HOST:mongo}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:zhgy}
      username: ${SPRING_DATA_MONGODB_USERNAME:root}
      password: ${SPRING_DATA_MONGODB_PASSWORD:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

jwt:
  user:
    secret-key: zhgy
    ttl: 3600000  #3600000

milvus:
  host: ${MILVUS_HOST:milvus}
  port: ${MILVUS_PORT:19530}


server:
  port: ${SERVER_PORT:8080}

zhgy:
  jwt:
    admin-secret-key: mei
    admin-ttl: 7200000 #7200000
    admin-token-name: token
    # >=32
    user-secret-key: ${ZHGY_JWT_USER_SECRET_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    user-ttl: ${ZHGY_JWT_USER_TTL:7200000}
    user-token-name: authentication
  upload:
    dir: ${ZHGY_UPLOAD_DIR:/app/uploads}
    base-url: ${ZHGY_UPLOAD_BASE_URL:http://backend:8080/uploads}

# Browser monitor frames are uploaded by the backend to Tencent COS. Keep the
# bucket private unless a public-base-url is intentionally configured; when it
# is private, the backend returns a short-lived signed GET URL for the run.
tencent-cos:
  enabled: ${TENCENT_COS_ENABLED:false}
  secret-id: ${TENCENT_COS_SECRET_ID:}
  secret-key: ${TENCENT_COS_SECRET_KEY:}
  region: ${TENCENT_COS_REGION:ap-chongqing}
  bucket: ${TENCENT_COS_BUCKET:}
  public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
  prefix: ${TENCENT_COS_PREFIX:farmap/diagnosis}

# 高德地图API配置
gaode:
  api:
    key: ${GAODE_API_KEY:}

# Open-Meteo is a free, keyless forecast provider for local development.
# Configured Gaode remains preferred when GAODE_API_KEY is present.
open-meteo:
  api:
    enabled: ${OPEN_METEO_API_ENABLED:true}
    base-url: ${OPEN_METEO_API_BASE_URL:https://api.open-meteo.com/v1/forecast}
    key: ${OPEN_METEO_API_KEY:}
    connect-timeout-ms: ${OPEN_METEO_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPEN_METEO_READ_TIMEOUT_MS:10000}

# 条件化配置，仅在需要时启用MongoDB和Milvus
spring.autoconfigure.exclude:
  - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
  - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  - org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

farmap:
  copilot:
    # true: allow clearly labelled general agricultural answers when no
    # private/public grounding is available; false: fail closed for L3.
    allow-ungrounded: ${FARMAP_COPILOT_ALLOW_UNGROUNDED:true}
  presentation-data:
    enabled: ${FARMAP_PRESENTATION_DATA_ENABLED:false}
  agent:
    persistence: ${FARMAP_AGENT_PERSISTENCE:file}
    max-steps: ${FARMAP_AGENT_MAX_STEPS:8}
    max-tool-calls: ${FARMAP_AGENT_MAX_TOOL_CALLS:12}
    max-replans: ${FARMAP_AGENT_MAX_REPLANS:1}
    timeout-ms: ${FARMAP_AGENT_TIMEOUT_MS:120000}
    max-recovery-attempts: ${FARMAP_AGENT_MAX_RECOVERY_ATTEMPTS:1}
    tool:
      max-attempts: ${FARMAP_AGENT_TOOL_MAX_ATTEMPTS:2}
      retry-base-delay-ms: ${FARMAP_AGENT_TOOL_RETRY_BASE_DELAY_MS:25}
  case-ingestion:
    enabled: ${FARMAP_CASE_INGESTION_ENABLED:false}
  knowledge:
    storage-dir: ${FARMAP_KNOWLEDGE_STORAGE_DIR:/app/knowledge-storage}
    chunk-size: ${FARMAP_KNOWLEDGE_CHUNK_SIZE:1200}
    chunk-overlap: ${FARMAP_KNOWLEDGE_CHUNK_OVERLAP:120}
    max-corpus-file-bytes: ${FARMAP_KNOWLEDGE_MAX_CORPUS_FILE_BYTES:67108864}
    # Stage A hybrid recall: RRF is the default; weighted preserves the old
    # 0.55/0.45 behavior for rollback and A/B comparison.
    fusion-mode: ${FARMAP_KNOWLEDGE_FUSION_MODE:rrf}
    rrf-k: ${FARMAP_KNOWLEDGE_RRF_K:60}
    dense-weight: ${FARMAP_KNOWLEDGE_DENSE_WEIGHT:1.0}
    bm25-weight: ${FARMAP_KNOWLEDGE_BM25_WEIGHT:1.0}
    dense-candidate-n: ${FARMAP_KNOWLEDGE_DENSE_CANDIDATE_N:30}
    lexical-candidate-n: ${FARMAP_KNOWLEDGE_LEXICAL_CANDIDATE_N:30}
    bm25-cache-capacity: ${FARMAP_KNOWLEDGE_BM25_CACHE_CAPACITY:8}
    min-score: ${FARMAP_KNOWLEDGE_MIN_SCORE:0.45}
  ai:
    service-token: ${FARMAP_INTELLIGENCE_SERVICE_TOKEN:}
    retrieval:
      weights:
        camera: ${FARMAP_RETRIEVAL_WEIGHT_CAMERA:1.0}
        weather: ${FARMAP_RETRIEVAL_WEIGHT_WEATHER:0.95}
        knowledge: ${FARMAP_RETRIEVAL_WEIGHT_KNOWLEDGE:1.0}
        historical-case: ${FARMAP_RETRIEVAL_WEIGHT_HISTORICAL:1.1}
        soil: ${FARMAP_RETRIEVAL_WEIGHT_SOIL:1.0}
        spatial: ${FARMAP_RETRIEVAL_WEIGHT_SPATIAL:0.9}
      knowledge:
        candidate-count: ${FARMAP_KNOWLEDGE_CANDIDATE_COUNT:8}
        top-k: ${FARMAP_KNOWLEDGE_TOP_K:3}
        min-score: ${FARMAP_KNOWLEDGE_MIN_SCORE:0.45}
        milvus-nlist: ${FARMAP_KNOWLEDGE_MILVUS_NLIST:128}
        lexical-weight: ${FARMAP_KNOWLEDGE_LEXICAL_WEIGHT:0.35}
        semantic-weight: ${FARMAP_KNOWLEDGE_SEMANTIC_WEIGHT:0.55}
        authority-weight: ${FARMAP_KNOWLEDGE_AUTHORITY_WEIGHT:0.10}

hikyun:
  access-key: ${HIKYUN_ACCESS_KEY:}
  secret-key: ${HIKYUN_SECRET_KEY:}
  product-code: ${HIKYUN_PRODUCT_CODE:}
  project-id: ${HIKYUN_PROJECT_ID:}
  # The legacy access/secret pair above powers the existing preview API.
  # Remote still capture uses Cloud Open API client credentials instead.
  client-id: ${HIKYUN_CLIENT_ID:}
  client-secret: ${HIKYUN_CLIENT_SECRET:}

spring.servlet.multipart:
  max-file-size: ${FARMAP_MULTIPART_MAX_FILE_SIZE:64MB}
  max-request-size: ${FARMAP_MULTIPART_MAX_REQUEST_SIZE:64MB}

# 日志配置
logging:
  level:
    com.mei.zhgy: debug
    org.springframework.web.client.RestTemplate: warn
