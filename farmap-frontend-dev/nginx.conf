server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Preserve the /api prefix; Spring controllers are mapped under
        # /api/**. A trailing slash here strips that prefix and turns valid
        # routes such as /api/copilot/chat into 404s.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The production frontend uses /api as its same-origin base URL, while
    # these legacy Spring controllers are intentionally still mounted at the
    # application root. Strip only this legacy subset; /api/copilot and the
    # other modern /api/** controllers keep the prefix above.
    location ~ ^/api/(user|weather|ai-model|historical-cases|expert|monitor)/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Legacy Spring endpoints used by the existing frontend. Keep these
    # same-origin routes behind the frontend container instead of letting the
    # SPA fallback handle POST requests as static content.
    location ~ ^/(user|weather|ai-model|historical-cases|expert|monitor)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Also accept the documented /farmap/<legacy-endpoint> form when a client
    # builds an API URL relative to the mounted application path.
    location ~ ^/farmap/(user|weather|ai-model|historical-cases|expert|monitor)/ {
        rewrite ^/farmap/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /farmap/;
    }

    location = /farmap {
        return 301 /farmap/;
    }

    location /farmap/ {
        try_files $uri $uri/ /farmap/index.html;
    }

    location / {
        return 302 /farmap$request_uri;
    }
}
